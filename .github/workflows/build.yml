name: Build firmware

on:
  workflow_dispatch:
    inputs:
      openwrt_tag:
        description: 'OpenWrt tag to build against'
        required: false
        default: 'v25.12.5'
  push:
    paths:
      - 'patches/**'
      - 'package/**'
      - 'config/**'
      - '.github/workflows/build.yml'

env:
  DEVICE: yiming-uz801v3
  UPSTREAM: https://github.com/hkfuertes/msm8916-openwrt

jobs:
  build:
    runs-on: ubuntu-24.04

    # The default token is read-only, so without this the release step fails
    # at the very end of an hour-long build.
    permissions:
      contents: write

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            ccache util-linux fdisk gcc-arm-none-eabi

      # mkbootimg is a host tool: the msm89xx image recipe calls it through
      # aboot-img to wrap the kernel. It is absent on the runner, and Ubuntu's
      # own mkbootimg package is unusable — it ships the script without the gki
      # module it imports, so it dies with ModuleNotFoundError. Take the tool
      # from AOSP, where both halves live together.
      - name: Install mkbootimg
        run: |
          sudo git clone -q --depth 1 \
            https://android.googlesource.com/platform/system/tools/mkbootimg \
            /opt/mkbootimg
          printf '#!/bin/sh\nexec env PYTHONPATH=/opt/mkbootimg python3 /opt/mkbootimg/mkbootimg.py "$@"\n' \
            | sudo tee /usr/local/bin/mkbootimg >/dev/null
          sudo chmod +x /usr/local/bin/mkbootimg

          # Prove it runs now, not an hour from now at image generation.
          head -c 4096 /dev/urandom > /tmp/fake-kernel
          mkbootimg --kernel /tmp/fake-kernel --ramdisk /dev/null \
            --cmdline "test" -o /tmp/fake-boot.img
          head -c 8 /tmp/fake-boot.img | grep -q 'ANDROID!' \
            || { echo "mkbootimg produced no Android boot image"; exit 1; }
          echo "mkbootimg works"

      - name: Resolve OpenWrt tag
        id: ver
        run: |
          TAG="${{ github.event.inputs.openwrt_tag }}"
          [ -z "$TAG" ] && TAG=v25.12.5
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Clone the msm89xx target and OpenWrt
        run: |
          git clone --depth 1 "$UPSTREAM" upstream
          git clone --depth 1 -b "${{ steps.ver.outputs.tag }}" \
            https://git.openwrt.org/openwrt/openwrt.git openwrt

      # Restore and save are kept separate on purpose. The all-in-one
      # actions/cache declares its save step as post-if: success(), so a build
      # that dies at the last step throws away the whole hour it just spent.
      # These builds fail often enough that saving on failure is the point.

      # Downloads change rarely and cost the most wall clock on a cold run.
      - name: Restore downloads cache
        id: cache-dl
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: dl-${{ steps.ver.outputs.tag }}-${{ hashFiles('overlay/config/diffconfig_uz801') }}
          restore-keys: |
            dl-${{ steps.ver.outputs.tag }}-
            dl-

      # The toolchain is the other expensive half; it only needs rebuilding
      # when the OpenWrt tag changes, not when our packages do.
      - name: Restore toolchain and staging cache
        id: cache-toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/staging_dir
            openwrt/build_dir/host
            openwrt/build_dir/toolchain-*
          key: toolchain-${{ steps.ver.outputs.tag }}-${{ runner.os }}
          restore-keys: |
            toolchain-${{ steps.ver.outputs.tag }}-

      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ steps.ver.outputs.tag }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ steps.ver.outputs.tag }}-
            ccache-

      - name: Apply the msm89xx target and packages
        run: |
          cd upstream
          chmod +x apply_patches.sh
          ./apply_patches.sh ../openwrt
          cp -r msm89xx  ../openwrt/target/linux/msm89xx
          cp -r packages ../openwrt/package/msm8916


      - name: Apply this repository on top
        run: |
          cp overlay/patches/*.patch openwrt/target/linux/msm89xx/patches/
          cp -r overlay/package/* openwrt/package/msm8916/
          # Merge our kernel symbols properly instead of cat >>.
          #
          # Upstream's config-6.12 ends without a newline, so a bare append
          # glued our first symbol onto their last one:
          #   CONFIG_ZSTD_DECOMPRESS=yCONFIG_STAGING=y
          # losing both. Losing CONFIG_STAGING is silent and fatal: fbtft lives
          # under drivers/staging, so its whole Kconfig stops being reachable
          # and FB_TFT plus our GC9107 driver vanish without a warning, exactly
          # like the FB_DEVICE trap this project started with.
          #
          # Existing entries are dropped first as well, so an earlier
          # "# CONFIG_X is not set" cannot shadow what we set here.
          CFG=openwrt/target/linux/msm89xx/config-6.12
          ADD=overlay/config/kernel-additions.txt
          printf '\n' >> "$CFG"
          while read -r line; do
            case "$line" in
              CONFIG_*)   SYM=${line%%=*} ;;
              "# CONFIG_"*) SYM=$(printf '%s' "$line" | awk '{print $2}') ;;
              *) continue ;;
            esac
            sed -i -e "\|^${SYM}=|d" -e "\|^# ${SYM} is not set\$|d" "$CFG"
          done < "$ADD"
          cat "$ADD" >> "$CFG"

          # Prove the merge landed: these two are what the screen hangs on.
          grep -qx 'CONFIG_STAGING=y' "$CFG" || { echo "CONFIG_STAGING did not merge"; exit 1; }
          grep -qx 'CONFIG_FB_TFT_GC9107=y' "$CFG" || { echo "GC9107 did not merge"; exit 1; }
          GLUED=$(grep -c 'CONFIG_.*=.*CONFIG_' "$CFG" || true)
          [ "${GLUED:-0}" -eq 0 ] || { echo "glued config lines: $GLUED"; exit 1; }
          echo "kernel config merged cleanly"

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        working-directory: openwrt
        run: |
          cp ../overlay/config/diffconfig_uz801 .config
          make defconfig

      # Fail here rather than 40 minutes later: a typo in the device tree is
      # the single most common way this build dies.
      - name: Sanity check the device tree
        working-directory: openwrt
        run: |
          make target/linux/prepare V=s 2>&1 | tail -20
          K=$(ls -d build_dir/target-*/linux-msm89xx_msm8916/linux-*/ | head -1)
          DTS="$K/arch/arm64/boot/dts/qcom/msm8916-yiming-uz801v3.dts"
          grep -q 'galaxycore,gc9107' "$DTS" || { echo "panel node missing from the DTS"; exit 1; }
          grep -q 'cs-gpios' "$DTS"          || { echo "cs-gpios missing from the DTS"; exit 1; }
          echo "device tree looks sane"

      - name: Build
        working-directory: openwrt
        run: |
          export CCACHE_DIR=~/.ccache
          make -j$(nproc) || make -j1 V=s

      # if: always() is what makes a failed build still worth its hour. Skipped
      # on an exact key hit, where there is nothing new to store.
      - name: Save downloads cache
        if: always() && steps.cache-dl.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: dl-${{ steps.ver.outputs.tag }}-${{ hashFiles('overlay/config/diffconfig_uz801') }}

      - name: Save toolchain and staging cache
        if: always() && steps.cache-toolchain.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/staging_dir
            openwrt/build_dir/host
            openwrt/build_dir/toolchain-*
          key: toolchain-${{ steps.ver.outputs.tag }}-${{ runner.os }}

      - name: Save ccache
        if: always() && steps.cache-ccache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ steps.ver.outputs.tag }}-${{ github.sha }}

      - name: Verify the built image
        working-directory: openwrt
        run: |
          BIN=bin/targets/msm89xx/msm8916
          ls -la $BIN/*.img
          K=$(ls -d build_dir/target-*/linux-msm89xx_msm8916/linux-*/ | head -1)
          DTB=build_dir/target-*/linux-msm89xx_msm8916/image-msm8916-yiming-uz801v3.dtb
          $K/scripts/dtc/dtc -I dtb -O dts $DTB -o /tmp/check.dts 2>/dev/null
          grep -q 'galaxycore,gc9107' /tmp/check.dts || { echo "panel missing from the built DTB"; exit 1; }
          grep -q 'sink' /tmp/check.dts             || { echo "backlight sink mode missing"; exit 1; }
          # Diagnose, don't just assert. A missing System.map, a driver built
          # as a module and a driver genuinely dropped by kconfig all used to
          # produce the same bare "not in kernel" line, which says nothing
          # about which of the three happened.
          echo "--- kernel dir: $K"
          if [ ! -f "$K/System.map" ]; then
            echo "System.map is missing"
            ls "$K" | head -20
            exit 1
          fi
          echo "--- display symbols in the kernel config ---"
          grep -E 'FB_TFT|GC9107|FB_DEVICE|FB_BACKLIGHT' "$K/.config" || echo "(nothing matched)"
          echo "--- modules built, if any ---"
          find "$K" -name 'fb_gc9107.ko' -o -name 'fbtft.ko' | head -5 || true
          N=$(grep -c -i 'fbtft\|gc9107' "$K/System.map" || true)
          echo "--- matching symbols in System.map: ${N:-0}"
          [ "${N:-0}" -gt 0 ] || { echo "display driver is not linked into the kernel"; exit 1; }
          echo "image verified"

      # Upload whatever was produced even if verification objected: the images
      # are built by then, and throwing away an hour's output because a check
      # script was wrong helps nobody.
      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.DEVICE }}
          path: |
            openwrt/bin/targets/msm89xx/msm8916/*.img
            openwrt/bin/targets/msm89xx/msm8916/*.bin
            openwrt/bin/targets/msm89xx/msm8916/*.zip
            openwrt/bin/targets/msm89xx/msm8916/*.manifest
            openwrt/bin/targets/msm89xx/msm8916/*flash.sh
            openwrt/bin/targets/msm89xx/msm8916/sha256sums

      # Artifacts expire after 90 days and need a GitHub login to download,
      # which is no good for a forum thread. Publish a release instead, so the
      # links in the README and on 4PDA point at something permanent that
      # anyone can fetch.
      - name: Publish a release
        if: success() && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd openwrt/bin/targets/msm89xx/msm8916
          TAG="${{ steps.ver.outputs.tag }}-$(date -u +%Y%m%d-%H%M)"

          cat > notes.md <<'NOTES'
          Two different jobs, do not confuse them.

          ## Coming from the stock Android — full conversion

          The stock partition table has no `rootfs` at all: it carries `system`,
          `userdata` and `cache` instead. Writing OpenWrt over it needs a new
          partition table and the bootloaders, not just the two images, and the
          radio partitions have to be saved and put back because repartitioning
          moves their offsets. `flash.sh` in this release does the whole thing —
          run it from a directory holding every file below.

          ## Already running OpenWrt — updating

          Only `boot` and `rootfs` are written. The partition table, the
          bootloaders and the radio partitions are left alone.

          ```sh
          edl --loader=prog_emmc_firehose_8916.mbn --memory=eMMC w boot   *-boot.img
          edl --loader=prog_emmc_firehose_8916.mbn --memory=eMMC w rootfs *-system.img
          edl --loader=prog_emmc_firehose_8916.mbn reset
          ```

          ## Both cases

          You need the Firehose programmer, which `edl` does not ship:

          ```sh
          curl -sLO https://raw.githubusercontent.com/OneLabsTools/Programmers/master/prog_emmc_firehose_8916.mbn
          ```

          The `--loader` is not optional: without it `edl` finds the device,
          prints `Mode detected: sahara` and waits forever, with nothing to send
          it. `reset` must be given without `--memory=eMMC`.

          Getting into EDL: holding Reset does **not** do it - on the stock
          Android that lands in fastboot, from which EDL needs `fastboot oem
          edl`. The method that works whatever is installed is to short `DP` to
          `GND` on the board and, holding the short, plug in USB. The device
          enumerates as `05c6:9008` and stays in EDL until it is reset or
          unplugged.

          Back up every partition before the first flash - `modem`, `modemst1`,
          `modemst2`, `fsg`, `fsc` and `persist` carry the IMEI and the radio
          calibration and cannot be regenerated. That command needs the loader
          too.

          If the device does not come back after `reset`, do not press the
          button: pull the cable and the battery for a few seconds. A boot that
          dies early leaves the PMIC still holding power, and in that state it
          considers the device to be running, so no press of any length will
          start it.
          NOTES

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "OpenWrt ${{ steps.ver.outputs.tag }} for ${{ env.DEVICE }}" \
            --notes-file notes.md \
            *-boot.img *-system.img *-gpt_both0.bin *-firmware.zip *flash.sh sha256sums
